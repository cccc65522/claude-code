# Runs every app's tests on pull requests and on pushes to the default branch.
# Each app is its own npm project, so each gets its own job. On the default branch,
# once they all pass, the deploy job publishes the site to GitHub Pages.
name: test

on:
  pull_request:
  push:
    branches: [claude/red-heels-mv-obby1j]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: review-app
            check: npm test
            e2e: true
          - app: sheet
            check: npm test
            e2e: true
          - app: xiangqi
            check: npm test
            e2e: true
          - app: physics
            check: npm test
            e2e: true
          - app: voxel-world
            check: npm test
            e2e: true
          - app: logic-lab
            check: npm run typecheck && npm test && npm run build
            e2e: true
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Unit tests and build
        run: ${{ matrix.check }}
      - name: Install Chromium for Playwright
        if: matrix.e2e
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        if: matrix.e2e
        run: npm run test:e2e -- --trace off

  # The apps' own suites run in Chromium. This builds the site as it will be published and opens
  # every app in WebKit (Safari's engine) at iPhone size: see smoke/smoke.spec.js.
  safari:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site
        run: scripts/build-site.sh .site/claude-code
      - name: Install Playwright and WebKit
        working-directory: smoke
        run: |
          npm ci
          npx playwright install --with-deps webkit
      - name: Smoke test in WebKit
        working-directory: smoke
        run: npx playwright test

  # After every app's tests pass on the default branch, publish the site to gh-pages
  # (GitHub Pages serves that branch). scripts/build-site.sh decides what goes where.
  deploy:
    needs: [app, safari]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site
        run: scripts/build-site.sh "$RUNNER_TEMP/site"
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Publish to gh-pages
        working-directory: pages
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$RUNNER_TEMP/site/." .
          git add -A
          if git diff --cached --quiet; then
            echo "The published site is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publish ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push origin HEAD:gh-pages
