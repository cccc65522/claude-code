<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3ead8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="弈">
  <title>弈 · 中国象棋</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="seal" aria-hidden="true">弈</span><span class="title">中国象棋</span></div>
      <div class="spacer"></div>
      <button class="btn ghost" data-cmd="new">新局</button>
      <button class="btn ghost" data-cmd="puzzles">残局</button>
      <button class="btn ghost icon" data-cmd="menu" aria-label="更多" aria-haspopup="menu">⋯</button>
    </header>

    <main class="main">
      <section class="play">
        <div class="player top" id="player-top"></div>
        <div class="board-wrap">
          <div class="board" id="board" aria-label="棋盘"></div>
          <div class="banner" id="banner" hidden></div>
        </div>
        <div class="player bottom" id="player-bottom"></div>
        <div class="controls" id="controls">
          <button class="btn" data-cmd="undo">悔棋</button>
          <button class="btn" data-cmd="hint">提示</button>
          <button class="btn" data-cmd="flip">翻转</button>
          <button class="btn" data-cmd="move-now" hidden>立即出招</button>
          <button class="btn danger-text" data-cmd="resign">认输</button>
        </div>
        <div class="review" id="review" hidden>
          <button class="btn icon" data-cmd="review-first" aria-label="开局">⏮</button>
          <button class="btn icon" data-cmd="review-prev" aria-label="上一步">◀</button>
          <span class="review-label" id="review-label"></span>
          <button class="btn icon" data-cmd="review-next" aria-label="下一步">▶</button>
          <button class="btn icon" data-cmd="review-last" aria-label="最新">⏭</button>
          <button class="btn primary" data-cmd="review-exit">回到对局</button>
        </div>
      </section>

      <aside class="side">
        <div class="panel">
          <div class="panel-head"><h2>棋谱</h2><span class="opening" id="opening"></span></div>
          <ol class="moves" id="moves" aria-label="着法记录"></ol>
          <form class="move-input" id="move-input" autocomplete="off">
            <input id="move-text" placeholder="输入着法，如 炮二平五 或 h2e2" aria-label="输入着法" spellcheck="false" autocapitalize="off">
            <button class="btn" type="submit">走</button>
          </form>
        </div>
        <div class="panel analysis" id="analysis">
          <div class="panel-head"><h2>引擎分析</h2><label class="switch"><input type="checkbox" id="show-analysis"> 显示</label></div>
          <div class="analysis-body" id="analysis-body"></div>
        </div>
      </aside>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
